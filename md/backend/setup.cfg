[flake8]
# Black đã format code ở giới hạn 88 ký tự (mặc định) — nhưng Black CHỦ Ý không bẻ dòng
# comment/docstring dài (đây là hành vi được ghi rõ trong tài liệu của Black, không phải bug).
# Codebase này có nhiều comment tiếng Việt giải thích "TẠI SAO" khá dài (đúng yêu cầu của
# core_principles.md), nên nới giới hạn dòng riêng cho Flake8 lên 160 — chỉ áp dụng cho lỗi độ
# dài dòng (E501), không ảnh hưởng gì đến cách Black format code.
max-line-length = 160
exclude = .git,__pycache__,venv,.venv,data
