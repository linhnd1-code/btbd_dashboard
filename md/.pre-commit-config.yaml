repos:
  # CÁC HOOK CHUNG
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace   # Xóa khoảng trắng thừa ở cuối dòng
      - id: end-of-file-fixer     # Đảm bảo cuối file có 1 dòng trống
      - id: check-yaml            # Kiểm tra file YAML có hợp lệ không
      - id: check-added-large-files # Chặn commit các file rác quá nặng (>500KB)

  # KIỂM TRA CHUẨN COMMIT MESSAGE (Commitlint)
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.13.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # BACKEND: PYTHON FORMATTING (Black & Isort)
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # BACKEND: LINTING & BẮT LỖI (Flake8)
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88"]

  # BACKEND: SECURITY SCANNER (Bandit)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # FRONTEND: LINTING & FORMATTING (Prettier & ESLint)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, html]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.54.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$  # Chỉ chạy trên file JS, TS
        types: [file]
